exp-1-thin {
  enforce_statfs = 2;
  devfs_ruleset = 5;
  exec.clean;
  exec.consolelog = /var/log/bastille/exp-1-thin_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = exp-1-thin;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/exp-1-thin/fstab;
  path = /usr/local/bastille/jails/exp-1-thin/root;
  securelevel = 2;
  osrelease = "15.0-RELEASE";

  ip4.addr = lo5|10.4.4.2;
  
  ip6 = disable;

  allow.raw_sockets=1;
  allow.mount.linprocfs;
  allow.mount.linsysfs;
  allow.mount.fdescfs;
}
