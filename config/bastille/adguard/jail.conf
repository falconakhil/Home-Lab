adguard {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/adguard_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = adguard;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/adguard/fstab;
  path = /usr/local/bastille/jails/adguard/root;
  securelevel = 2;
  osrelease = 15.0-RELEASE;

  ip4.addr = lo1|10.0.0.53;
  
  ip6 = disable;
}
