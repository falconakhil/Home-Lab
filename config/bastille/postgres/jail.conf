postgres {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/postgres_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = postgres;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/postgres/fstab;
  path = /usr/local/bastille/jails/postgres/root;
  securelevel = 2;
  osrelease = 15.0-RELEASE;

  ip4.addr = lo4|10.3.3.54;
  
  ip6 = disable;

  allow.raw_sockets=true;

  sysvshm = "new";
  sysvsem = "new";
  sysvmsg = "new";
}
