arr {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/arr_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = arr;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/arr/fstab;
  path = /usr/local/bastille/jails/arr/root;
  securelevel = 2;
  osrelease = 15.0-RELEASE;

  ip4.addr = lo3|10.2.2.81;
  
  ip6 = disable;
  allow.raw_sockets=1;
  allow.socket_af=1;
  allow.mlock = 1;
}
