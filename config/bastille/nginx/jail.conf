nginx {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/nginx_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = nginx;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/nginx/fstab;
  path = /usr/local/bastille/jails/nginx/root;
  securelevel = 2;
  osrelease = 15.0-RELEASE;

  ip4.addr = lo2|10.1.1.80;
  
  ip6 = disable;

  allow.raw_sockets=1;
}
