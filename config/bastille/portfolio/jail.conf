portfolio {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/portfolio_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = portfolio;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/portfolio/fstab;
  path = /usr/local/bastille/jails/portfolio/root;
  securelevel = 2;
  osrelease = "15.0-RELEASE";

  ip4.addr = lo2|10.1.1.84;
  
  ip6 = disable;
}
