monitoring {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/monitoring_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = monitoring;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/monitoring/fstab;
  path = /usr/local/bastille/jails/monitoring/root;
  securelevel = 2;
  osrelease = "15.0-RELEASE";

  ip4.addr = lo1|10.0.0.80;
  
  ip6 = disable;
  allow.raw_sockets=1;
}
