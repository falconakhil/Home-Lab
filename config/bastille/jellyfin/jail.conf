jellyfin {
  enforce_statfs = 2;
  devfs_ruleset = 4;
  exec.clean;
  exec.consolelog = /var/log/bastille/jellyfin_console.log;
  exec.start = '/bin/sh /etc/rc';
  exec.stop = '/bin/sh /etc/rc.shutdown';
  host.hostname = jellyfin;
  mount.devfs;
  mount.fstab = /usr/local/bastille/jails/jellyfin/fstab;
  path = /usr/local/bastille/jails/jellyfin/root;
  securelevel = 2;
  osrelease = 15.0-RELEASE;

  ip4.addr = lo2|10.1.1.83;
  
  ip6 = disable;
  
  allow.raw_sockets=true;
  allow.mlock=1;
}
