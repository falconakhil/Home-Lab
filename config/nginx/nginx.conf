    #    }
    #}

    # HTTPS server
    #
    #server {
    #    listen 443 ssl;
    #    server_name localhost;
    #
    #    ssl_certificate cert.pem;
    #    ssl_certificate_key cert.key;
    #
    #    ssl_session_cache shared:SSL:1m;
    #    ssl_session_timeout 5m;
    #
    #    ssl_ciphers HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers on;
    #
    #    location / {
    #        root html;
    #        index index.html index.htm;
    #    }
    #}

    #include /usr/local/etc/nginx/conf.d/*.conf;

    upstream vaultwarden-default {
        zone vaultwarden-default 64k;
        server 10.1.1.81:8081;
        keepalive 2;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    server {
        listen 80;
        server_name akhil-server.taile64214.ts.net;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name akhil-server.taile64214.ts.net;

        #ssl_certificate     /usr/local/etc/nginx/ssl/tailscale/akhil-server.taile64214.ts.net.crt;
        #ssl_certificate_key /usr/local/etc/nginx/ssl/tailscale/akhil-server.taile64214.ts.net.key;

        include snippets/ssl-shared.conf;

        client_max_body_size 525M;

        #
        # Vaultwarden
        #
        location /vaultwarden/ {
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /vaultwarden;

            proxy_pass http://vaultwarden-default;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        #
        # Nextcloud
        #
	location = /.well-known/caldav {
    		return 301 /nextcloud/remote.php/dav;
	}

	location = /.well-known/carddav {
    		return 301 /nextcloud/remote.php/dav;
	}
        location /nextcloud/ {
            # Note the trailing slash after the IP/Port!
            # This strips "/nextcloud"
            proxy_pass http://10.1.1.82:80/;

	    # Fix Photos app's duplicated remote.php/dav path bug
    	    rewrite ^/nextcloud/remote\.php/dav/nextcloud/remote\.php/dav/(.*)$ /nextcloud/remote.php/dav/$1 redirect;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 10G;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        #
        # Sonarr
        #
        location ^~ /sonarr {
            proxy_pass http://10.2.2.81:8989;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        # Allow the API external access via NGINX
        location ^~ /sonarr/api {
            auth_basic off;
            proxy_pass http://10.2.2.81:8989;
        }

        #
        # Radarr
        #
        location ^~ /radarr {
            proxy_pass http://10.2.2.81:7878;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        # Allow the API external access via NGINX
        location ^~ /radarr/api {
            auth_basic off;
            proxy_pass http://10.2.2.81:7878;
        }

        #
        # Prowlarr
        #
        location ^~ /prowlarr {
            proxy_pass http://10.2.2.81:9696;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        #
        # Jellyfin
        #
        location /jellyfin/ {
            proxy_pass http://10.1.1.83:8096/;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    #
    # Portfolio 
    #
    server {
    	listen 80;
        server_name portfolio.akhils.tech;

    	location / {
        	proxy_pass http://10.1.1.84:80;
    	}
}
}
