# Interfaces
ext_if = "igc0"
tailscale_if="tailscale0"
lo_core  = "lo1"   # BastilleCore  10.0.0.0/24
lo_web   = "lo2"   # BastilleWeb   10.1.1.0/24
lo_media = "lo3"   # BastilleMedia 10.2.2.0/24
lo_db    = "lo4"   # BastilleDB    10.3.3.0/24
lo_exp   = "lo5"   # BastilleExp   10.4.4.0/24

lan_net = "192.168.88.0/24"
tailnet = "100.64.0.0/10"

host = "192.168.88.100/24"

bastille_core = "10.0.0.0/24"
bastille_web = "10.1.1.0/24"
bastille_media = "10.2.2.0/24"
bastille_db = "10.3.3.0/24"
bastille_experimental = "10.4.4.0/24"

cloudflared = "10.0.0.10" 
adguard = "10.0.0.53"
monitoring = "10.0.0.80"
vaultwarden = "10.1.1.81"
nextcloud="10.1.1.82"
jellyfin="10.1.1.83"
nginx = "10.1.1.80"
postgres="10.3.3.54"
arr="10.2.2.81"

# NAT
nat on $ext_if from $bastille_core to any -> ($ext_if) # BastilleCore
nat on $ext_if from $nginx to any -> ($ext_if)  # BastilleWeb (nginx only)
nat on $ext_if from $jellyfin to any -> ($ext_if)  # BastilleWeb (nginx only)
nat on $ext_if from $bastille_media to any -> ($ext_if)  # BastilleMedia
nat on $ext_if from $bastille_experimental to any -> ($ext_if)  # BastilleExperimental
nat on $tailscale_if from $nginx to any -> ($tailscale_if)  # BastilleWeb (nginx only) Tailscale
nat on $tailscale_if from $monitoring to any -> ($tailscale_if)

# Temporary
# nat on $ext_if from $nextcloud to any -> ($ext_if) 
# nat on $ext_if from $vaultwarden to any -> ($ext_if) 

# Adguard
rdr on $ext_if proto tcp from any to any port 5380 -> $adguard port 80
rdr on $tailscale_if proto tcp from any to any port 5380 -> $adguard port 80
rdr on $ext_if proto tcp from any to any port 53  -> $adguard port 53
rdr on $ext_if proto udp from any to any port 53  -> $adguard port 53

# Nginx
rdr on $ext_if proto tcp from any to any port 80  -> $nginx port 80
rdr on $ext_if proto tcp from any to any port 443 -> $nginx port 443
rdr on $tailscale_if proto tcp from any to any port 443 -> $nginx port 443

# Monitoring
rdr on $tailscale_if proto tcp from any to any port 3000 -> $monitoring port 3000

# Block All
block all

# Allow all intra interface traffic
pass quick on lo0 from (lo0) to (lo0)
pass quick on $lo_core  from $bastille_core  to $bastille_core
pass quick on $lo_web   from $bastille_web   to $bastille_web
pass quick on $lo_media from $bastille_media to $bastille_media
pass quick on $lo_db    from $bastille_db    to $bastille_db
pass quick on $lo_exp   from $bastille_experimental to $bastille_experimental

# NextCloud <=> Postgres
pass out quick on {$lo_web, $lo_db} proto tcp from $nextcloud to $postgres port 5432 keep state
pass in  quick on {$lo_web, $lo_db} proto tcp from $nextcloud to $postgres port 5432 keep state

# Arr <=> Nginx
pass out quick on {$lo_web, $lo_media} proto tcp from $nginx to $arr port {8989, 7878, 9696} keep state
pass in  quick on {$lo_web, $lo_media} proto tcp from $nginx to $arr port {8989, 7878, 9696} keep state

# Cloudflared <=> Nginx
pass out quick on {$lo_web, $lo_core} proto tcp from $cloudflared to $nginx port {80,443} keep state
pass in  quick on {$lo_web, $lo_core} proto tcp from $cloudflared to $nginx port {80,443} keep state

# DNS resolution for Jails
pass quick on $lo_core proto {tcp, udp} from {$bastille_web, $bastille_media, $bastille_db, $bastille_experimental} to $adguard port 53 no state
pass quick on {$lo_web, $lo_media, $lo_db, $lo_exp} proto {tcp, udp} from $adguard to {$bastille_web, $bastille_media, $bastille_db, $bastille_experimental} no state

# Keep state on outbound host traffic
pass out quick on $ext_if from $host keep state
pass out quick on $tailscale_if from $host to any keep state

# Outbound internet access
pass out quick on $ext_if proto {tcp, udp} from $nginx to any keep state    # nginx — reverse proxy egress
pass out quick on $ext_if proto {tcp, udp} from $adguard to any keep state  # adguard — upstream DNS resolution

# Ping
pass in quick on $ext_if inet proto icmp from $ext_if:network to (self)
pass in quick on $tailscale_if inet proto icmp from $tailnet to (self)

# SSH
pass in quick on $ext_if proto tcp from $lan_net to (self) port 22
pass in quick on $tailscale_if proto tcp from $tailnet to (self) port 22

# DNS
pass in quick on $ext_if proto {tcp,udp} from any to $adguard port 53
pass in quick on $ext_if proto tcp from any to $adguard port 80

# Nginx
pass in quick on $ext_if proto tcp from any to $nginx port {80, 443}
pass in quick on $tailscale_if proto tcp from $tailnet to $nginx port {80,443}

# Bastille
# pass in quick on $ext_if proto tcp from $lan_net to (self) port 8080 keep state
# pass in quick on lo0 proto tcp from any to (lo0) port 8888 keep state

# Core dashboards
pass in quick on $tailscale_if proto tcp from $tailnet to $monitoring port {3000}
pass in quick on $tailscale_if proto tcp from $tailnet to $adguard port {80}
