global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "jails"
    static_configs:
      - targets: ["10.0.0.1:9452"]

  - job_name: "system"
    static_configs:
      - targets: ["10.0.0.1:9100"]
